<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Faso-Concours 2026-2027</title>
<style>
body{font-family:system-ui;background:#f8fafc;margin:0}
.top{background:#0f5132;color:#fff;padding:12px;text-align:center;font-weight:bold}
.card{background:#fff;border:1px solid #e5e7eb;border-left:4px solid #16a34a;border-radius:12px;padding:12px;margin:10px}
.btn{display:block;background:#16a34a;color:#fff;padding:16px;text-align:center;border-radius:30px;text-decoration:none;font-weight:bold;margin:20px 10px}
.foot{background:#0f5132;color:#fff;text-align:center;padding:14px;margin-top:20px}
</style>
</head>
<body>
<div class="top">FASO-CONCOURS 🇧🇫 Créé par Ouedraogo</div>
<div style="padding:12px">
<h1 style="text-align:center">🔥 Les 137 Concours Directs 2026-2027 à VENIR</h1>
<p style="text-align:center;color:#16a34a;font-weight:bold">12 995 postes - sur e-concours.gov.bf</p>
<h2 style="text-align:center">📋 Les 137 Concours à Venir</h2>
<div id="liste"></div>
<a href="https://e-concours.gov.bf" target="_blank" class="btn">👉 S'INSCRIRE OFFICIELLEMENT SUR e-concours.gov.bf</a>
<p style="text-align:center;font-size:12px;color:gray">Les vraies dates uniquement sur e-concours.gov.bf</p>
</div>
<div class="foot">Faso-Concours 2026-2027 - Créé par Ouedraogo</div>
<script>
const C=["Adjoints Administratifs","Agents de Bureau","ENAREF","ENA","ENS","ENAM","Greffiers","Secrétaires Greffes","Police Nationale","Douane","Trésor","Impôts","GSP","Eaux et Forêts","Infirmiers","Sages-Femmes","Professeurs des Ecoles","Instituteurs","Professeurs Lycée","Informatique","Génie Civil","Gendarmerie","Magistrature"];
let h="";
C.forEach(n=>{h+=`<div class="card">✅ <b>${n}</b> - À venir<br><a href="https://e-concours.gov.bf" style="color:#16a34a;font-weight:bold;text-decoration:none">👉 Voir sur e-concours.gov.bf</a></div>`;});
for(let i=C.length+1;i<=137;i++){h+=`<div class="card">✅ <b>Concours ${i}</b> - À venir<br><a href="https://e-concours.gov.bf" style="color:#16a34a;font-weight:bold;text-decoration:none">👉 Voir sur e-concours</a></div>`;}
document.getElementById('liste').innerHTML=h;
</script>
</body>
</html>

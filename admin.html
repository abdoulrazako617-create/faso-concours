<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><script defer src="https://cdn.vercel-insights.com/v1/script.js"></script><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-gray-100 p-4"><div class="max-w-xl mx-auto bg-white rounded-xl shadow p-6"><h1 class="font-black text-xl mb-4">➕ Ajouter concours</h1><input id="titre" placeholder="Ex: ENAREF 2026" class="w-full border p-3 rounded-lg mb-3"><input id="postes" placeholder="Ex: 100 postes" class="w-full border p-3 rounded-lg mb-3"><input id="date" type="date" class="w-full border p-3 rounded-lg mb-3"><input id="lien" placeholder="Lien concours.gov.bf" class="w-full border p-3 rounded-lg mb-3"><button onclick="ajouter()" class="w-full bg-green-700 text-white py-3 rounded-lg font-bold">Publier sur le site</button><div id="msg" class="mt-3 text-center font-bold"></div><a href="/" class="block text-center mt-4 text-green-700 font-bold">← Voir le site</a><hr class="my-6"><h2 class="font-bold">Concours ajoutés</h2><div id="list"></div></div><script>function load(){return JSON.parse(localStorage.getItem('concours')||'[]')}function save(d){localStorage.setItem('concours',JSON.stringify(d))}function ajouter(){const t=document.getElementById('titre').value,p=document.getElementById('postes').value,d=document.getElementById('date').value,l=document.getElementById('lien').value;if(!t||!p||!d){msg.innerText='Remplis tout !';return}const arr=load();arr.unshift({titre:t,postes:p,date:d,lien:l||'https://www.concours.gov.bf'});save(arr);msg.innerText='✅ Publié !';setTimeout(()=>location.href='/',1000)}function aff(){list.innerHTML=load().map((c,i)=>`<div class="flex justify-between border p-2 mt-2 rounded"><span>${c.titre}</span><button onclick="supp(${i})" class="text-red-600">X</button></div>`).join('')}function supp(i){const a=load();a.splice(i,1);save(a);aff()}aff();</script></body></html>
